- id: schema-org-tourist-attraction
  name: Schema.org TouristAttraction / Offer (tourism vocabulary)
  conforms: true
  surface: html-json-ld
  evidence: >-
    Each experience page embeds application/ld+json with @type TouristAttraction, touristType, PostalAddress
    (addressCountry NO), an Offer (price, priceCurrency NOK, availability) and a provider Organization — e.g.
    https://opplevagent.no/opplevelse/forsvarsmuseet-akershus-festning-medieval-fortress-military-museum-oslo--6d325224.
    The home page embeds a WebSite with SearchAction. This is the HTML surface, not the API contract: the OpenAPI
    Experience schema uses its own field names (fylke, kommune, price_from) rather than schema.org terms.
