aid: opplevagent-no
name: Opplevagent
description: Opplevagent is an agent-native (A2A) marketplace of Norwegian experiences and activities — 547 hand-picked
  tours, courses, attractions and things to do from 417 providers verified against Brønnøysundregistrene, plus a
  gårdssalg vertical of 252 farm-sale drink producers (breweries, cideries, wineries, distilleries). Agents and
  humans query the same catalog through an open, read-only REST discovery API described by an OpenAPI 3.1 document,
  a remote Streamable-HTTP MCP server (also shipped as the opplevagent-mcp npm package for stdio clients) with five
  tools including a pending-only booking request, and an A2A JSON-RPC endpoint described by a signed agent card
  at /.well-known/agent-card.json. No authentication is required; an optional free X-API-Key raises the rate limits.
  Operated from Norway by Daniel Fredriksen on the same codebase as the sibling sites rettfrabonden.com and finn-tannlege.com.
