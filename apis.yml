- aid: opplevagent-no:a2a-agent
  name: Opplevagent A2A Agent
  description: >-
    A2A JSON-RPC 2.0 endpoint at https://opplevagent.no/a2a described by a signed agent card (protocolVersion
    1.0.0, JSONRPC transport, three skills: discover experiences, get experience details, list categories)
    at /.well-known/agent-card.json. Accepts message/send (and tasks/send as a pre-0.3 alias) with natural-language
    text in Norwegian or English or structured JSON filters, and returns a completed Task with a text
    summary and a data artifact. No streaming, no push notifications, no authentication.
  humanURL: https://opplevagent.no/llms.txt
