apis:
- aid: opplevagent-no:discovery-api
  name: Opplevagent Discovery API
  description: 'Read-only REST discovery over verified Norwegian experiences and gårdssalg producers: intent discovery
    with county, municipality, category, weather, season, indoor/outdoor, group size, age, price, duration, language
    and near-me (lat/lng/radius) filters; a category list with live counts; and a single-experience lookup by UUID.
    Anonymous, with IETF RateLimit headers on every response (300 requests per 900 s; 900 with the optional free
    X-API-Key). The OpenAPI also declares the A2A card, the A2A JSON-RPC endpoint and llms.txt as operations.'
  humanURL: https://opplevagent.no/llms.txt
  baseURL: https://opplevagent.no/api/opplevelser
