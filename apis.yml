- aid: opplevagent-no:mcp-server
  name: Opplevagent MCP Server
  description: Remote Model Context Protocol server over Streamable HTTP at https://opplevagent.no/mcp, anonymous
    and session-based (initialize first, then echo mcp-session-id). A live tools/list returns five tools with input
    schemas and annotations — discover_experiences, list_experience_categories, get_experience, discover_gardssalg
    and the write tool book_gardssalg, which only ever creates a pending request the producer confirms by e-mail
    — plus two ui:// resources. The same server ships as the opplevagent-mcp npm package (npx opplevagent-mcp) and
    a server card is published at /.well-known/mcp/server-card.json.
  humanURL: https://opplevagent.no/guide-opplevelser-mcp
  baseURL: https://opplevagent.no/mcp
