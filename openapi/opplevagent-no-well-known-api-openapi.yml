openapi: 3.2.0
info:
  title: Opplevagent .well Known API
  description: REST API for Norwegian experience and activity discovery. Experiences are harvested from curated sources and provider-verified against Brønnøysundregistrene. All read endpoints are public; no authentication required.
  version: 0.1.0
  contact:
    url: https://opplevagent.no
  license:
    name: CC0 (Brreg data)
    url: https://creativecommons.org/publicdomain/zero/1.0/
servers:
- url: https://opplevagent.no
  description: Production
tags:
- name: .well Known
paths:
  /.well-known/agent-card.json:
    get:
      operationId: getExperiencesAgentCardWellKnown
      summary: A2A Agent Card (well-known)
      responses:
        '200':
          description: Agent card
          content:
            application/json:
              schema:
                type: object
      tags:
      - .well Known
