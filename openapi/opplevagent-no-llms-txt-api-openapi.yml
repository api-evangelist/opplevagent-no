openapi: 3.2.0
info:
  title: Opplevagent Llms.txt API
  description: REST API for Norwegian experience and activity discovery. Experiences are harvested from curated sources and provider-verified against Brønnøysundregistrene. All read endpoints are public; no authentication required.
  version: 0.1.0
  contact:
    url: https://opplevagent.no
  license:
    name: CC0 (Brreg data)
    url: https://creativecommons.org/publicdomain/zero/1.0/
servers:
- url: https://opplevagent.no
  description: Production
tags:
- name: Llms.txt
paths:
  /llms.txt:
    get:
      operationId: getExperiencesLlmsTxt
      summary: LLM-friendly site overview
      responses:
        '200':
          description: Plain-text overview for LLMs
          content:
            text/plain:
              schema:
                type: string
      tags:
      - Llms.txt
