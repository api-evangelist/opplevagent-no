  host: opplevagent.no
  note: >-
    Served from the apex host, which is also the OpenAPI servers[] host, the REST base, the MCP host and the A2A
    endpoint host — Opplevagent runs everything on one origin. www.opplevagent.no 301s every /.well-known/* path
    to the apex. The legacy /.well-known/agent.json 404s (a real HTML 404 page titled "Side ikke funnet (404)",
    not an SPA shell). The provider also publishes an alias at https://opplevagent.no/agent-card.json (200) and
    names both in llms.txt and /.well-known/agents.txt. Ownership is not in question: provider.organization is
    "Opplevagent", provider.url is https://opplevagent.no, the card's endpoints block points only at
    opplevagent.no, and the OpenAPI it links declares servers[] https://opplevagent.no.
